<!DOCTYPE html>
<html>

    <head>
        <title>My Registration Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Student Registration</h1>
        <form>
            <fieldset>
                <legend><b>Personal Information:</b></legend>

                    <label for="studentName"><b>Name:</b></label>

                <input 
                    type="text" 
                    id="studentName" 
                    name="name"
                    placeholder="Enter your name" 
                    required
                >

                    <label for="studentEmailAddress"><b>Email:</b></label>

                <input 
                    type="email" 
                    id="studentEmailAddress" 
                    name="email"
                    placeholder="Enter your email" 
                    required
                >
            
                    <label for="studentPassword"><b>Password</b></label>

                <input 
                    type="password" 
                    id="studentPassword" 
                    name="password"
                    placeholder="Enter your password" 
                    required
                >

                    <label for="studentAge"><b>Age:</b></label>

                <input 
                    type="number" 
                    id="studentAge" 
                    name="age"
                    placeholder="Enter your age" 
                    required
                >
            </fieldset>
            
            <fieldset>
                <legend><b>Gender:</b></legend>

                    <label for="male"><b>Male:</b></label>

                <input 
                    type="radio" 
                    id="male" 
                    name="gender" 
                    value="male"
                >

                <label for="female"><b>Female:</b></label>

                <input 
                    type="radio" 
                    id="female" 
                    name="gender" 
                    value="female"
                >

                <label for="preferNotToSay"><b>Prefer not to say:</b></label>

                <input 
                    type="radio" 
                    id="preferNotToSay" 
                    name="gender" 
                    value="prefer not to say"   
                >
            </fieldset>

            <fieldset>
                <legend><b>Programming Languages:</b></legend>

                    <label for="java"><b>Java</b></label>   

                <input 
                    type="checkbox" 
                    id="java" 
                    name="language[]" 
                    value="Java"
                >

                <label for="python"><b>Python</b></label>

                <input 
                    type="checkbox" 
                    id="python" 
                    name="language[]" 
                    value="Python"
                >

                <label for="javascript"><b>JavaScript</b></label>

                <input 
                    type="checkbox" 
                    id="javascript" 
                    name="language[]" 
                    value="JavaScript"
                >
            </fieldset>

            <fieldset>
                <legend><b>Country Information:</b></legend>

                    <label for="country"><b>Country</b></label>

                    <select id="country" name="country" required>
                        <option value="" selected>Select your country</option>
                        <option value="nigeria">Nigeria</option>
                        <option value="ghana">Ghana</option>
                        <option value="south africa">South Africa</option>
                    </select>
            </fieldset>

            <fieldset>
                <legend><b>Additional Information:</b></legend>

                    <label for="reason"><b>Why do you want to learn programming?</b></label>

                    <textarea 
                        name="reason"
                        id="reason"
                        rows="5"
                        cols="40"
                        required
                    ></textarea>
            </fieldset>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
        </form>

        <form action="/register" method="POST"></form>

        <p>Already have an account? <a href="login.html">Login here</a></p>

        <p>&copy; 2026 My Website. All rights reserved.</p>
    </body>
</html>
