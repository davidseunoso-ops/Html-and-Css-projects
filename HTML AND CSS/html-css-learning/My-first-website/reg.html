<!DOCTYPE html>
<html lang="en">

    <head>
        <title>My Registration Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                padding: 20px;
                background-color: #f4f4f4;
            }

            h1 {
                color: #333;
            }

            form {
                background-color: #fff;
                padding: 20px;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                max-width: 500px;
                margin: 0 auto;
            }

            fieldset {
                border: none;
                margin-bottom: 15px;
                padding: 0;
            }

            legend {
                font-weight: bold;
                margin-bottom: 10px;
            }

            label {
                display: block;
                margin-bottom: 5px;
            }

            /* Overrode display block for inline radio/checkbox layouts */
            .inline-label {
                display: inline-block;
                margin-right: 15px;
                font-weight: normal;
                cursor: pointer;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="number"],
            select {
                width: 100%;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }

            input[type="submit"] {
                background-color: #007BFF;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
                width: 100%;
            }

            input[type="submit"]:hover {
                background-color: #0056b3;
            }
        </style>
    </head>

    <body>
        <h1 style="text-align: center;">Student Registration</h1>
        
        <form action="#" method="POST">
            <fieldset>
                <legend><b>Personal Information:</b></legend>

                <label for="studentName"><b>Name:</b></label>
                <input 
                    type="text" 
                    id="studentName" 
                    name="name"
                    placeholder="Enter your name" 
                    required
                >

                <label for="studentEmailAddress"><b>Email:</b></label>
                <input 
                    type="email" 
                    id="studentEmailAddress" 
                    name="email"
                    placeholder="Enter your email" 
                    required
                >
            
                <label for="studentPassword"><b>Password</b></label>
                <input 
                    type="password" 
                    id="studentPassword" 
                    name="password"
                    placeholder="Enter your password" 
                    required
                >

                <label for="studentAge"><b>Age:</b></label>
                <input 
                    type="number" 
                    id="studentAge" 
                    name="age"
                    placeholder="Enter your age" 
                    required
                >
            </fieldset>
            
            <fieldset>
                <legend><b>Gender:</b></legend>

                <label class="inline-label">
                    <input type="radio" id="male" name="gender" value="male"> Male
                </label>

                <label class="inline-label">
                    <input type="radio" id="female" name="gender" value="female"> Female
                </label>

                <label class="inline-label">
                    <input type="radio" id="preferNotToSay" name="gender" value="prefer not to say"> Prefer not to say
                </label>
            </fieldset>

            <fieldset>
                <legend><b>Programming Languages:</b></legend>

                <label class="inline-label">
                    <input type="checkbox" id="java" name="language[]" value="Java"> Java
                </label>

                <label class="inline-label">
                    <input type="checkbox" id="python" name="language[]" value="Python"> Python
                </label>

                <label class="inline-label">
                    <input type="checkbox" id="javascript" name="language[]" value="JavaScript"> JavaScript
                </label>
            </fieldset>

            <fieldset>
                <legend><b>Country Information:</b></legend>

                <label for="country"><b>Country</b></label>
                <select id="country" name="country">
                    <option value="nigeria">Nigeria</option>
                    <option value="ghana">Ghana</option>
                    <option value="south africa">South Africa</option>
                </select>
            </fieldset>

            <input type="submit" value="Register">
        </form>
    </body>
</html>
