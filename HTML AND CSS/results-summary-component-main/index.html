<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | Results summary component</title>
  </head>

  <body>
    <main class="container">
      <section class="result-summary">
        <div class="result-header">
          <h3>Your Result</h3>
        </div>

        <div class="score-area">
          <h1>76</h1>
          <p>of 100</p>
        </div>

        <div class="comment">
          <h3>Great</h3>
          <p>You scored higher than 65% of the people who have taken these tests.</p>
        </div>
      </section>

      <section class="summary-section">
        <h3>Summary</h3>
        <div class="summary-table">
          <div class="summary-item reaction">
            <div class="category">
              <img class="icon" src="icon-reaction.svg" alt="Reaction icon">
              <span>Reaction</span>
            </div>
            <div class="score">
              <span>80</span> / 100
            </div>
          </div>
          
          <div class="summary-item memory">
            <div class="category">
              <img class="icon" src="icon-memory.svg" alt="Memory icon">
              <span>Memory</span>
            </div>
            <div class="score">
              <span>92</span> / 100
            </div>
          </div>

          <div class="summary-item verbal">
            <div class="category">
              <img class="icon" src="icon-verbal.svg" alt="Verbal icon">
              <span>Verbal</span>
            </div>
            <div class="score">
              <span>61</span> / 100
            </div>
          </div>

          <div class="summary-item visual">
            <div class="category">
              <img class="icon" src="icon-visual.svg" alt="Visual icon">
              <span>Visual</span>
            </div>
            <div class="score">
              <span>72</span> / 100
            </div>
          </div>
        </div>

        <button class="continue-button" type="button">Continue</button>
      </section>
    </main>
  </body>
</html>
